<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MNIST手写数字识别</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <div>
            <div class="header-title">MNIST手写数字识别</div>
            <div class="header-sub">基于深度学习的手写数字智能识别平台</div>
        </div>
    </header>

    <main class="home-main">
        <section class="card-group" aria-label="识别功能">
            <article class="card-feature">
                <div class="icon" aria-hidden="true">📤</div>
                <h2>图片上传识别</h2>
                <p>上传一张 PNG 图片，识别手写数字</p>
                <a href="/upload" class="btn-main">立即上传</a>
            </article>
            <article class="card-feature">
                <div class="icon" aria-hidden="true">📊</div>
                <h2>批量图片识别</h2>
                <p>一次上传多张图片，查看识别结果与准确率</p>
                <a href="/batch" class="btn-main">批量识别</a>
            </article>
            <article class="card-feature">
                <div class="icon" aria-hidden="true">✏️</div>
                <h2>手写输入识别</h2>
                <p>在网页画布上书写数字，立即获得识别结果</p>
                <a href="/draw" class="btn-main">开始手写</a>
            </article>
        </section>
    </main>

    <footer class="footer">
        &copy; 2024 MNIST手写数字识别平台 | Powered by Flask &amp; ONNX Runtime
    </footer>
</body>
</html>
